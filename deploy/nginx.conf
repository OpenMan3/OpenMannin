# nginx in front of OpenMannin.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/openmannin
#   sudo ln -s /etc/nginx/sites-available/openmannin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two things this config is careful about, both of which were real bugs during
# development and would be easy to reintroduce here:
#
# 1. Do NOT cache or rewrite /api/tiles/. That route is a tile proxy which sets
#    its own Cache-Control (one week, immutable) and validates z/x/y strictly.
#    Anything in front of it that second-guesses the content type will break
#    MapLibre's ability to decode the tiles, and the symptom is a blank
#    basemap rather than an error.
#
# 2. Do NOT gzip the tile route. PNGs are already compressed; the CPU cost buys
#    nothing and it adds a failure mode for no gain.

map $sent_http_content_type $om_tiles {
    default                 0;
    ~*^image/               1;
}

server {
    listen 80;
    listen [::]:80;
    server_name openmannin.example.org;

    # ACME challenge for TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openmannin.example.org;

    ssl_certificate     /etc/letsencrypt/live/openmannin.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openmannin.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- security headers --------------------------------------------------
    # X-Content-Type-Options is already set by next.config.ts, but nginx can
    # serve static assets from /public directly and would not inherit it there,
    # so it is repeated. Duplicate response headers are harmless; a missing one
    # on the worker bundle is not.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The map renders its own data and talks to no third-party origin at runtime
    # - all upstream calls are server-side. So the policy can be tight. If you
    # ever add a live feed that calls a provider directly from the browser,
    # connect-src has to widen.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:" always;

    # ---- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # MapLibre builds style expressions and uses inline styles; the client is
    # a single page so body size is not a concern either way.
    client_max_body_size 1m;

    # ---- the MapLibre worker ----------------------------------------------
    # Must be served as JavaScript. It is written into public/ at build time by
    # scripts/copy-maplibre-worker.mjs, and MapView calls setWorkerUrl() for it.
    # If this location is wrong the browser is handed text/html, refuses it, and
    # EVERY data layer silently disappears while the basemap keeps drawing.
    location = /maplibre-gl-worker.mjs {
        include /etc/nginx/mime.types;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /maplibre-gl-shared.mjs {
        include /etc/nginx/mime.types;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- proxied tiles -----------------------------------------------------
    location ^~ /api/tiles/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upstream is already a CDN. Let its caching headers through untouched.
        proxy_buffering off;
    }

    # ---- live routes -------------------------------------------------------
    # /api/passes is cheap and cacheable for 15 minutes by its own design.
    # /api/marine is NOT cached: it is a live vessel feed, and caching it would
    # show stale positions as if they were current.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /api/marine {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 70s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Static data files are regenerated on every ingest and served with their
    # own etag; letting the browser revalidate avoids pinning 10 MB of stale
    # GeoJSON.
    location ~* ^/data/.*\.geojson$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }
}

# Required by the Connection upgrade header above. Put in the http{} block of
# your main nginx.conf if it is not already there:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }