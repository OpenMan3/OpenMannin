# nginx in front of OpenMannin - STATIC ORIGIN.
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx-security.conf /etc/nginx/snippets/openmannin-security.conf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/openmannin
#   sudo ln -s /etc/nginx/sites-available/openmannin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# WHAT CHANGED, AND WHY. This used to proxy everything to `next start` on
# :3000, including seven /api/* routes. None of that exists any more: the app
# is an `output: "export"` static build and the API routes were deleted along
# with the server they needed. nginx now serves out/ straight off disk. There
# is no upstream, no proxy_cache, no upgrade map and nothing to keep in sync
# with a running process - and if you keep the systemd unit as well, point its
# root at the same directory (it is redundant; see deploy/openmannin.service).
#
# Edit `root` below to wherever out/ lives on your host.
#
# Two things this config is careful about, both of which were real bugs:
#
# 1. /maplibre-gl-worker.mjs, /maplibre-gl-shared.mjs and /passes-worker.mjs
#    must be served as JavaScript. If a location hands the browser text/html
#    for them, MapLibre refuses the worker and EVERY data layer silently
#    disappears while the basemap keeps drawing.
#
# 2. Every location that sets its own Cache-Control re-includes the security
#    snippet, because nginx drops inherited add_header directives the moment a
#    location declares any of its own - see the header of that file.

server {
    listen 80;
    listen [::]:80;
    server_name openmannin.example.org;

    # ACME challenge for TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openmannin.example.org;

    # The static export. `npm run build` writes it; there is no build step on
    # this host and no process to restart after copying new files.
    root /opt/openmannin/out;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/openmannin.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openmannin.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers, from the snippet. This is the server level, so it is
    # what every location inherits - unless that location declares add_header
    # itself, which is why they all include this file again.
    include /etc/nginx/snippets/openmannin-security.conf;

    # Next's export inlines its flight payload, so the HTML is worth gzipping;
    # the GeoJSON layers are 10 MB uncompressed and are the real saving.
    # .pbf/.png are left alone - already compressed, and MapLibre reads them
    # byte-exact anyway.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/geo+json image/svg+xml
               application/xml application/manifest+json;

    # A missing path gets the exported 404 page rather than nginx's own.
    error_page 404 /404.html;

    # ---- workers -----------------------------------------------------------
    # Same content type for all three, set with default_type (a directive that
    # does NOT suppress add_header inheritance - unlike a types{} block in some
    # nginx versions) plus the snippet for the headers that do matter.
    location ~* ^/(maplibre-gl-worker|maplibre-gl-shared|passes-worker)\.mjs$ {
        include /etc/nginx/snippets/openmannin-security.conf;
        default_type text/javascript;
        # Content-hashed? No - these are copied in verbatim from node_modules
        # and rebuilt per version, so revalidate weekly rather than forever.
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    }

    # ---- content with its own cache policy ---------------------------------
    # One year, immutable: /_next/static filenames contain a content hash, so a
    # hit can never be wrong.
    location /_next/static/ {
        include /etc/nginx/snippets/openmannin-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A build-time report, and the platform health check target. no-cache so a
    # redeploy is visible on the first request instead of whenever the proxy
    # feels like revalidating.
    location = /health.json {
        include /etc/nginx/snippets/openmannin-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The data layers are ~10 MB in total and change only on ingest. One hour
    # of caching with mandatory revalidation is the difference between a snappy
    # page and re-downloading the island on every visit.
    location ~* \.geojson$ {
        include /etc/nginx/snippets/openmannin-security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/openmannin-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- everything else ---------------------------------------------------
    location / {
        include /etc/nginx/snippets/openmannin-security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
