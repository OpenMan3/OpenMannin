# Security headers for the OpenMannin nginx site.
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx-security.conf /etc/nginx/snippets/openmannin-security.conf
#
# WHY A SNIPPET AT ALL. nginx only inherits `add_header` from an outer level if
# the inner level declares NONE - so every `location` that sets its own
# Cache-Control silently drops the CSP, X-Content-Type-Options and friends.
# That is not a theoretical risk: the previous version of this config had
# exactly that hole on /maplibre-gl-worker.mjs. Locations that need their own
# cache header therefore re-include this file rather than trusting inheritance.
#
# THESE VALUES MUST MATCH scripts/static-headers.mjs, which owns the same
# policy for public/_headers (Cloudflare Pages) and scripts/serve.mjs (Docker,
# Fly, systemd). scripts/static-headers.test.mjs fails if they drift. Edit that
# file first, then copy the values here - never the other way round.
#
#   Content-Security-Policy: the map fetches tiles from OpenTopoMap and
#   OpenStreetMap, glyphs from Carto and TLEs from CelesTrak, all from the
#   browser. A `connect-src 'self'` (which this once had) blanks every one of
#   those and looks like an app bug.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://s3.amazonaws.com; font-src 'self' data:; connect-src 'self' https://celestrak.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://a.tile.opentopomap.org https://b.tile.opentopomap.org https://c.tile.opentopomap.org https://tiles.openfreemap.org https://tiles.basemaps.cartocdn.com https://s3.amazonaws.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
