# OpenMannin - local deployment. `docker compose up` builds and runs.
#
# The ingest step runs inside the image build. It calls third-party APIs
# (Overpass, CelesTrak, gov.im) that rate-limit, so if a build fails here, check
# whether it was ingest rather than anything to do with this configuration.
# To build without network dependency, bake data in first:
#
#   npm run ingest:all && docker build --build-arg SKIP_INGEST=1 -t openmannin .

services:
  openmannin:
    build:
      context: .
      args:
        # Set to 1 only when public/data has already been populated.
        SKIP_INGEST: "0"
    image: openmannin
    container_name: openmannin
    restart: unless-stopped
    ports:
      - "3000:3000"
    # No environment variables, deliberately. Nothing in this deployment reads
    # one: the export is static, and weather and satellite passes run in the
    # browser. Nothing needs injecting here.
    #
    # The one thing that does depend on the environment is the port: PORT is
    # read by scripts/serve.mjs and defaults to 3000.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health.json').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Tiles are fetched by the browser straight from OpenTopoMap and ArcGIS, and
    # the client feeds run from the browser too, so no request ever originates
    # from this container. There is no egress to restrict and no bandwidth bill
    # on this host.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"